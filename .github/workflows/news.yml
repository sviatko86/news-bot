name: News bot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = probnyi zapusk, 0 = publikuvaty"
        default: "1"

permissions:
  contents: write

concurrency:
  group: news-bot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == '1' && '1' || '' }}

      - name: Save seen.db
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          cp seen.db /tmp/seen.db
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/seen.db seen.db
            git add seen.db
            git diff --cached --quiet && exit 0
            git commit -m "update seen"
            git push && exit 0
            sleep 3
          done
          exit 1
